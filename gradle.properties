# FoxLoader's gradle plugin defaults to Java 21; we build against the JDK installed here.
foxloader.java-version=17

# This machine cannot create AF_UNIX sockets inside %TEMP%, and JDK 17 builds its internal
# NIO pipe (used by every Selector, including Gradle's daemon connection) from one. Point it
# at a directory that works, otherwise every build dies with "Unable to establish loopback
# connection".
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
